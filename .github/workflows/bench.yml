name: ARM64 benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out submission branch
        uses: actions/checkout@v4
        with:
          repository: NioHast/twelve-dollar-server-challenge
          ref: arm64-port
          path: repo
      - name: Host architecture
        run: uname -a
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 jq curl openssl
      - name: Install Nim
        run: sudo bash repo/submissions/nim-io_uring-NioHast/install.sh
      - name: Generate seed database and build
        run: |
          bash seed/make-seed.sh
          bash submissions/nim-io_uring-NioHast/build.sh
        working-directory: repo
      - name: Install k6
        run: |
          curl -fsSL -o /tmp/k6.tgz https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-arm64.tar.gz
          tar -xzf /tmp/k6.tgz -C /tmp
          sudo install /tmp/k6-v2.3.0-linux-arm64/k6 /usr/local/bin/k6
      - name: Run 64-VU mixed workload on one server CPU
        working-directory: repo
        run: |
          set -euo pipefail
          cat > bench/mixed-nowait.js <<'EOF'
          import http from 'k6/http';
          import { check } from 'k6';
          import { SharedArray } from 'k6/data';

          const BASE_URL = __ENV.BASE_URL || 'http://127.0.0.1:3000';
          const tokens = new SharedArray('tokens', () => JSON.parse(open(__ENV.TOKENS)));

          export const options = {
            vus: 64,
            duration: '30s',
            thresholds: {
              http_req_duration: ['p(95)<500', 'p(99)<1000'],
              http_req_failed: ['rate<0.01'],
            },
            summaryTrendStats: ['avg', 'med', 'p(95)', 'p(99)', 'max'],
          };

          export default function () {
            const user = tokens[(__VU - 1) % tokens.length];
            const auth = {
              headers: {
                Authorization: `Bearer ${user.token}`,
                'Content-Type': 'application/json',
              },
            };

            const feed = http.get(`${BASE_URL}/feed`);
            if (!check(feed, { 'feed 200': (r) => r.status === 200 })) return;
            const posts = feed.json('posts');
            if (!posts || posts.length === 0) return;
            const post = posts[Math.floor(Math.random() * posts.length)];

            check(http.get(`${BASE_URL}/posts/${post.id}`), {
              'post 200': (r) => r.status === 200,
            });

            if (Math.random() < 0.15) {
              check(http.post(`${BASE_URL}/posts/${post.id}/like`, null, auth), {
                'like 200/201': (r) => r.status === 200 || r.status === 201,
              });
            }
            if (Math.random() < 0.02) {
              const body = JSON.stringify({
                body: `${user.username} says hi at ${new Date().toISOString()}`,
              });
              check(http.post(`${BASE_URL}/posts`, body, auth), {
                'create 201': (r) => r.status === 201,
              });
            }
          }
          EOF
          cp seed/feed.db /tmp/bench.db
          rm -f /tmp/bench.db-wal /tmp/bench.db-shm
          prlimit --nofile=65535:65535 taskset -c 0 env \
            SQLITE_PATH=/tmp/bench.db JWT_SECRET=twelve-dollar-challenge \
            HOST=127.0.0.1 PORT=3000 IOURING_BUFS=256 ZEROCOPY_STATS=0 \
            submissions/nim-io_uring-NioHast/bin/server >/tmp/server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true' EXIT
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:3000/health >/dev/null && break
            sleep 1
          done
          taskset -c 1-3 k6 run --summary-export /tmp/summary.json \
            -e BASE_URL=http://127.0.0.1:3000 \
            -e TOKENS=../seed/tokens.json \
            bench/mixed-nowait.js | tee /tmp/k6.log
          echo '--- k6 summary ---'
          grep -E 'http_reqs|http_req_duration|http_req_failed' /tmp/k6.log || true
          echo '--- server log ---'
          cat /tmp/server.log
