name: ARM64 validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    name: ARM64 PGO=${{ matrix.pgo }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pgo: ["0", "1"]
    steps:
      - name: Check out submission branch
        uses: actions/checkout@v4
        with:
          repository: NioHast/twelve-dollar-server-challenge
          ref: arm64-port
          path: repo
      - name: Host architecture
        run: uname -a
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 jq curl openssl
      - name: Install Nim and build dependencies
        run: sudo bash repo/submissions/nim-io_uring-NioHast/install.sh
      - name: Generate seed database
        run: bash seed/make-seed.sh
        working-directory: repo
      - name: Build, start and run 42 checks
        run: bash test/run.sh submissions/nim-io_uring-NioHast
        working-directory: repo
        env:
          PGO: ${{ matrix.pgo }}
          BUILD_VARIANT: danger
