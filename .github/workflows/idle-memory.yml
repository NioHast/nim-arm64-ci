name: Idle connection memory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  idle:
    name: ${{ matrix.impl }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - impl: nim
            arch: x86_64
            runner: ubuntu-24.04
            repo: NioHast/twelve-dollar-server-challenge
            ref: Nim-io_uring-NioHast
            subdir: submissions/nim-io_uring-NioHast
            server_cmd: submissions/nim-io_uring-NioHast/bin/server
            loadgen_cpus: "2-3"
          - impl: nim
            arch: arm64
            runner: ubuntu-24.04-arm
            repo: NioHast/twelve-dollar-server-challenge
            ref: Nim-io_uring-NioHast
            subdir: submissions/nim-io_uring-NioHast
            server_cmd: submissions/nim-io_uring-NioHast/bin/server
            loadgen_cpus: "1-2"
          - impl: rust
            arch: x86_64
            runner: ubuntu-24.04
            repo: arjaythedev/twelve-dollar-server-challenge
            ref: refs/pull/82/head
            subdir: submissions/rust-epoll-scooter1337
            server_cmd: bash submissions/rust-epoll-scooter1337/start.sh
            loadgen_cpus: "2-3"
          - impl: rust
            arch: arm64
            runner: ubuntu-24.04-arm
            repo: arjaythedev/twelve-dollar-server-challenge
            ref: refs/pull/82/head
            subdir: submissions/rust-epoll-scooter1337
            server_cmd: bash submissions/rust-epoll-scooter1337/start.sh
            loadgen_cpus: "1-2"
    steps:
      - name: Check out submission
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: repo
      - name: Check out load generator
        uses: actions/checkout@v4
        with:
          repository: NioHast/nim-arm64-ci
          ref: main
          path: ci
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 jq curl openssl build-essential
      - name: Install runtime
        run: sudo bash "repo/${{ matrix.subdir }}/install.sh"
      - name: Generate seed database
        run: bash seed/make-seed.sh
        working-directory: repo
      - name: Build submission and load generator
        run: |
          bash "${{ matrix.subdir }}/build.sh"
          gcc -O2 -pthread -o /tmp/loadgen ../ci/loadgen.c
        working-directory: repo
      - name: Measure 64k idle connections
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p bench-db
          cp seed/feed.db bench-db/feed.db
          rm -f bench-db/feed.db-wal bench-db/feed.db-shm
          docker rm -f bench >/dev/null 2>&1 || true
          docker run -d --name bench --network host \
            --cpuset-cpus=0 --cpus=1 --memory=2g --memory-swap=2g \
            --ulimit nofile=65535:65535 --security-opt seccomp=unconfined \
            -v "$PWD":/work -w /work \
            -e SQLITE_PATH=/work/bench-db/feed.db \
            -e JWT_SECRET=twelve-dollar-challenge \
            -e HOST=127.0.0.1 -e PORT=3000 \
            -e IOURING_BUFS=256 -e ZEROCOPY_STATS=0 \
            ubuntu:24.04 ${{ matrix.server_cmd }}
          trap 'docker rm -f bench >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 120); do
            curl -sf http://127.0.0.1:3000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health >/dev/null
          echo '--- baseline ---'
          docker exec bench sh -c 'grep -E "VmRSS|VmHWM|VmSize" /proc/1/status'
          docker stats --no-stream --format 'container_mem={{.MemUsage}}' bench
          ulimit -n 200000 2>/dev/null || true
          taskset -c ${{ matrix.loadgen_cpus }} /tmp/loadgen -H 127.0.0.1 -p 3000 \
            -c 64000 -d 90 -t 3600000 -m mixed \
            -T "$PWD/seed/tokens.json" >/tmp/idle.log 2>&1 &
          lpid=$!
          connected=0
          for _ in $(seq 90); do
            connected=$(grep -o 'connected=[0-9]*' /tmp/idle.log | tail -1 | cut -d= -f2 || true)
            connected=${connected:-0}
            if [ "$connected" -ge 64000 ]; then break; fi
            sleep 1
          done
          sleep 5
          echo "connected=$connected"
          echo '--- loaded idle ---'
          docker exec bench sh -c 'grep -E "VmRSS|VmHWM|VmSize" /proc/1/status'
          docker exec bench sh -c 'cat /sys/fs/cgroup/memory.current 2>/dev/null || true'
          docker stats --no-stream --format 'container_mem={{.MemUsage}}' bench
          echo '--- loadgen ---'
          grep -E 'loadgen: target|connections|requests|errors' /tmp/idle.log || true
          kill "$lpid" 2>/dev/null || true
          wait "$lpid" 2>/dev/null || true
          docker rm -f bench >/dev/null 2>&1 || true
          trap - EXIT
