name: Official-style Nim vs Rust

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.impl }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - impl: nim
            arch: x86_64
            runner: ubuntu-24.04
            repo: NioHast/twelve-dollar-server-challenge
            ref: Nim-io_uring-NioHast
            subdir: submissions/nim-io_uring-NioHast
            server_cmd: submissions/nim-io_uring-NioHast/bin/server
            loadgen_cpus: "2-3"
          - impl: nim
            arch: arm64
            runner: ubuntu-24.04-arm
            repo: NioHast/twelve-dollar-server-challenge
            ref: Nim-io_uring-NioHast
            subdir: submissions/nim-io_uring-NioHast
            server_cmd: submissions/nim-io_uring-NioHast/bin/server
            loadgen_cpus: "1-2"
          - impl: rust
            arch: x86_64
            runner: ubuntu-24.04
            repo: arjaythedev/twelve-dollar-server-challenge
            ref: refs/pull/82/head
            subdir: submissions/rust-epoll-scooter1337
            server_cmd: bash submissions/rust-epoll-scooter1337/start.sh
            loadgen_cpus: "2-3"
          - impl: rust
            arch: arm64
            runner: ubuntu-24.04-arm
            repo: arjaythedev/twelve-dollar-server-challenge
            ref: refs/pull/82/head
            subdir: submissions/rust-epoll-scooter1337
            server_cmd: bash submissions/rust-epoll-scooter1337/start.sh
            loadgen_cpus: "1-2"
    steps:
      - name: Check out submission
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: repo
      - name: Check out load generator
        uses: actions/checkout@v4
        with:
          repository: NioHast/nim-arm64-ci
          ref: main
          path: ci
      - name: Host architecture
        run: uname -a
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 jq curl openssl build-essential
      - name: Install runtime
        run: sudo bash "repo/${{ matrix.subdir }}/install.sh"
      - name: Generate seed database
        run: bash seed/make-seed.sh
        working-directory: repo
      - name: Build submission and load generator
        run: |
          bash "${{ matrix.subdir }}/build.sh"
          gcc -O2 -pthread -o /tmp/loadgen ../ci/loadgen.c
        working-directory: repo
      - name: 64k-connection official-style hold
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p bench-db
          cp seed/feed.db bench-db/feed.db
          rm -f bench-db/feed.db-wal bench-db/feed.db-shm
          docker rm -f bench >/dev/null 2>&1 || true
          docker run -d --name bench --network host \
            --cpuset-cpus=0 --cpus=1 --memory=2g --memory-swap=2g \
            --ulimit nofile=65535:65535 --security-opt seccomp=unconfined \
            -v "$PWD":/work -w /work \
            -e SQLITE_PATH=/work/bench-db/feed.db \
            -e JWT_SECRET=twelve-dollar-challenge \
            -e HOST=127.0.0.1 -e PORT=3000 \
            -e IOURING_BUFS=256 -e ZEROCOPY_STATS=0 \
            ubuntu:24.04 ${{ matrix.server_cmd }}
          trap 'docker rm -f bench >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 120); do
            curl -sf http://127.0.0.1:3000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health >/dev/null
          set +e
          prlimit --nofile=200000:200000 taskset -c ${{ matrix.loadgen_cpus }} \
            /tmp/loadgen -H 127.0.0.1 -p 3000 \
            -c 64000 -d 360 -t 9000 -m mixed \
            -T "$PWD/seed/tokens.json" | tee /tmp/hold.log
          hold_rc=${PIPESTATUS[0]}
          set -e
          echo "hold_exit=$hold_rc"
          echo '--- hold summary ---'
          tail -30 /tmp/hold.log
          echo '--- hold server log ---'
          docker logs bench 2>&1 | tail -80 || true
          docker rm -f bench >/dev/null 2>&1 || true
          trap - EXIT
      - name: 64-connection saturation run
        working-directory: repo
        run: |
          set -euo pipefail
          rm -f bench-db/feed.db bench-db/feed.db-wal bench-db/feed.db-shm
          cp seed/feed.db bench-db/feed.db
          docker rm -f bench >/dev/null 2>&1 || true
          docker run -d --name bench --network host \
            --cpuset-cpus=0 --cpus=1 --memory=2g --memory-swap=2g \
            --ulimit nofile=65535:65535 --security-opt seccomp=unconfined \
            -v "$PWD":/work -w /work \
            -e SQLITE_PATH=/work/bench-db/feed.db \
            -e JWT_SECRET=twelve-dollar-challenge \
            -e HOST=127.0.0.1 -e PORT=3000 \
            -e IOURING_BUFS=256 -e ZEROCOPY_STATS=0 \
            ubuntu:24.04 ${{ matrix.server_cmd }}
          trap 'docker rm -f bench >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 120); do
            curl -sf http://127.0.0.1:3000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health >/dev/null
          set +e
          prlimit --nofile=200000:200000 taskset -c ${{ matrix.loadgen_cpus }} \
            /tmp/loadgen -H 127.0.0.1 -p 3000 \
            -c 64 -d 30 -t 0 -m mixed \
            -T "$PWD/seed/tokens.json" | tee /tmp/sat.log
          sat_rc=${PIPESTATUS[0]}
          set -e
          echo "sat_exit=$sat_rc"
          echo '--- saturation summary ---'
          tail -30 /tmp/sat.log
          echo '--- saturation server log ---'
          docker logs bench 2>&1 | tail -80 || true
          docker rm -f bench >/dev/null 2>&1 || true
          trap - EXIT
